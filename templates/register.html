{% extends "base.html" %}
{% block title %}Register - ACC Consultation System{% endblock %}
{% block content %}
<div class="form-box" style="max-width:560px;">
  <h1>Create an Account</h1>
  <p class="sub">Register as a Student or as a Medical Expert</p>
  <form method="POST" action="{{ url_for('auth.register') }}">

    <div class="role-choice">
      <label>
        <input type="radio" name="role" value="student" checked onclick="toggleExpertField(false)">
        <span>🎓 Student</span>
      </label>
      <label>
        <input type="radio" name="role" value="medical_expert" onclick="toggleExpertField(true)">
        <span>🩺 Medical Expert</span>
      </label>
    </div>

    <div class="field">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" required>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="field" id="student_field">
      <label for="student_id_number">Student ID Number</label>
      <input type="text" id="student_id_number" name="student_id_number" placeholder="e.g. 2026-00123">
    </div>

    <div class="field" id="expert_field" style="display:none;">
      <label for="specialization">Specialization</label>
      <input type="text" id="specialization" name="specialization" placeholder="e.g. General Medicine, Dentistry">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6">
    </div>

    <div class="field">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
    </div>

    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </form>
  <p class="sub" style="margin-top:1.2rem;">
    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
  </p>
</div>

<script>
  function toggleExpertField(isExpert) {
    document.getElementById('expert_field').style.display = isExpert ? 'block' : 'none';
    document.getElementById('student_field').style.display = isExpert ? 'none' : 'block';
  }
</script>
{% endblock %}
