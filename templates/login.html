{% extends "base.html" %}
{% block title %}Log In - ACC Consultation System{% endblock %}
{% block content %}
<div class="form-box">
  <h1>Welcome Back</h1>
  <p class="sub">Log in to your ACC Consultation System account</p>
  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log In</button>
  </form>
  <p class="sub" style="margin-top:1.2rem;">
    Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
  </p>
</div>
{% endblock %}
